[project]
name = "cookbook-2"
version = "1.0.0"
dependencies = [
    "cyclopts>=4.19.0",
    "doit>=0.37.0",
    "pyyaml>=6.0.3",
]
requires-python = ">=3.14"

[tool.ruff]
line-length = 90

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.isort]
profile = "black"
line_length = 90

[tool.basedpyright]
reportImplicitStringConcatenation = false
pythonVersion = "3.12"
